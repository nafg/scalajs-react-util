# Canonical .scala-steward.conf for nafg library repos.
# Copies of this file live in each repo root (the public scala-steward
# instance only reads per-repo config). This copy is the source of truth
# for the daily drift check.
#
# Pin Scala 3 to the 3.3 LTS line: these are libraries, and building on a
# Next-line compiler raises the minimum compiler version for all consumers.
# Lift to "3.9." once Scala 3.9.0 (the next LTS) is released.
updates.pin = [
  { groupId = "org.scala-lang", artifactId = "scala3-library", version = "3.3." },
  { groupId = "org.scala-lang", artifactId = "scala3-library_sjs1_3", version = "3.3." }
]
